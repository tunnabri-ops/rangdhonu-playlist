name: Combine and Update Playlist

on:
  schedule:
    - cron: '0 0 * * *' # Protidin ekbar automatic run hobe
  workflow_dispatch: # Manual run korar option

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run update script
        run: python update.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-combine and update playlists [skip ci]'
          branch: main
